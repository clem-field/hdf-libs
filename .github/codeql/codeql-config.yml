# CodeQL configuration for default setup, wired via the
# `github-codeql-config-file` repository property (Settings → Custom
# properties). Default setup analyzes go + javascript-typescript.
#
# Excluded paths are non-shipped or non-source inputs that would only
# produce noise: real-world tool-output fixtures, Go testdata, build
# output, and the VitePress docs site.
name: hdf-libs CodeQL config
paths-ignore:
  - '**/fixtures/**'
  - '**/testdata/**'
  - '**/dist/**'
  - 'site/**'
